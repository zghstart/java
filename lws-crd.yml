apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: leaderworkersets.leaderworkerset.x-k8s.io
spec:
  group: leaderworkerset.x-k8s.io
  names:
    kind: LeaderWorkerSet
    plural: leaderworkersets
    shortNames: [lws]
    singular: leaderworkerset
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [leaderWorkerTemplate]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 1
                leaderWorkerTemplate:
                  type: object
                  required: [size, leaderTemplate, workerTemplate]
                  properties:
                    size:
                      type: integer
                      minimum: 0
                    restartPolicy:
                      type: string
                      enum: [RecreateGroupOnPodRestart, RollingUpdate]
                      default: RecreateGroupOn
                    leaderTemplate:
                      type: object
                      # 关键：这里不写任何子字段，让它变成结构化、可生成
                      x-kubernetes-preserve-unknown-fields: true
                      properties: {}
                      additionalProperties: false
                    workerTemplate:
                      type: object
                      # 关键：workerTemplate 整个是 PodTemplateSpec，直接放行
                      x-kubernetes-preserve-unknown-fields: true   # 只留这一个！
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
        status: {}